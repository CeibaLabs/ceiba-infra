name: secret-scan

# Runs gitleaks against every push and PR so a leaked credential is caught
# before it lands, not found later in a point-in-time history scan. This is
# the standing gap the 2026-08-14 secret-scan report and D-054 both named:
# a scan of history at one moment says nothing about what the *next* commit
# introduces. This repo is public, so a real leak here is exposed
# immediately - the highest-severity place in the workspace for this
# control to exist.
#
# Deliberately its own workflow, not folded into terraform-plan.yml: that
# workflow only triggers on terraform/** paths, but a leaked credential can
# land in any file (docs, scripts, an accidentally-committed .env).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans only this push/PR's commit(s) - actions/checkout's default
      # shallow clone (fetch-depth 1) means gitleaks' own default history
      # scan only sees what's new, not a slow re-scan of the whole repo on
      # every run. The gitleaks CLI is MIT-licensed and free regardless of
      # repo visibility; only the maintained gitleaks-action wrapper
      # requires a paid license for private repos (moot here, but kept
      # consistent with the same approach used in ceiba-runtime/
      # ceiba-control-plane's CI), so this runs the CLI directly via its
      # official Docker image and needs no license/secret of its own.
      - name: Scan for leaked secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --exit-code 1
