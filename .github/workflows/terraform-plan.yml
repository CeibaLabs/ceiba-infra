name: terraform-plan

# Runs `terraform plan` on PR — never `apply`. Matches the README's stated
# intent and this repo's standing review-gate discipline (no automated actor
# is authorized to change real infrastructure; a human always applies).
#
# PREREQUISITE THIS WORKFLOW CANNOT SET UP ITSELF: terraform/github-oidc.tf
# provisions the role this workflow needs (ceiba-github-plan, read-only, OIDC
# trust pinned to this exact workflow's pull_request trigger), but Terraform
# cannot apply itself — a human runs `terraform apply`, then copies the
# `github_plan_role_arn` output into this repository's own Settings >
# Secrets and variables > Actions > Variables as AWS_PLAN_ROLE_ARN. Until
# both of those happen, this workflow fails at the "Configure AWS
# credentials" step — expected and correct (fail closed, not open) rather
# than falling back to long-lived access-key secrets.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write # required for OIDC federation to AWS — no long-lived keys
  pull-requests: write # required to post the plan output as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          # This only sets the STS session's ambient region — terraform's own
          # provider blocks in providers.tf pin their real regions explicitly
          # (var.aws_region for the primary provider, a hardcoded us-east-1
          # for the billing-metrics alias only), so plan/apply is unaffected
          # either way. Matched to the real deploy region for a reader's
          # sake, not because the mismatch was functionally broken.
          aws-region: ca-central-1

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        env:
          # budget_alert_email has no default (variables.tf) precisely so it
          # can't be silently applied — CI supplies a placeholder so `plan`
          # can run read-only without a real operator email in a repo
          # variable. This value is never used for anything but computing
          # the plan diff.
          TF_VAR_budget_alert_email: "ci-plan-placeholder@useceiba.com"
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
